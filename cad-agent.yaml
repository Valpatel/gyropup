# cad-agent project definition (toolkit: Valpatel/cad-agent). Run from this directory:
#   .venv/bin/cad-agent build          # catalog check, material table, design summaries
#   .venv/bin/cad-agent site --serve   # local dashboard: progress, designs, decisions, docs
cad:
  name: gyropup
  title: Gyropup
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  steps:
    - {name: catalog,   run: tools/check_catalog.py}
    - {name: materials, run: tools/build_materials.py}
    - {name: designs,   run: tools/summarize_designs.py, needs: [catalog, materials]}
  site:
    title: Gyropup
    tagline: A friendly self-balancing wheel-legged robot, and the closed-loop tool that designs, simulates and builds it
    notice: Private. Closed source for now.
    accent: "#e8892b"
    milestones: docs/milestones.yaml
    decisions: docs/decisions.yaml
    designs: exports/designs.json
    pages: [README.md, "docs/*.md", "research/*.md", catalog/SCHEMA.md]
    links:
      - {title: Open the designer, href: designer/}
      - {title: Architecture, href: site/pages/docs-architecture-md.html}
      - {title: Requirements, href: site/pages/docs-requirements-md.html}
      - {title: Repository, href: "https://github.com/Valpatel/gyropup"}
