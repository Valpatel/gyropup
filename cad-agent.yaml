# cad-agent project definition (toolkit: Valpatel/cad-agent). Run from this directory:
#   .venv/bin/cad-agent build          # catalog check, material table, design summaries
#   .venv/bin/cad-agent site --serve   # local dashboard: progress, designs, decisions, docs
cad:
  name: gyropup
  title: Gyropup
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  view:
    parts: false
    extra: [{glob: "exports/asm_*.step", strip: "asm_"}]
    colors: {tray: "#2f343c", hip_yoke: "#3b3f46", thigh: "#f5b82e", shin: "#f5b82e", knee_crank: "#8a9099", pushrod: "#8a9099",
             head_saddle: "#3b3f46", face: "#2f343c", camera_cradle: "#3b3f46", lidar_hanger: "#3b3f46", j501_box: "#e8892b",
             battery: "#fdb913", hip_motor: "#9aa3ad", knee_motor: "#9aa3ad", wheel: "#1d2025", lidar: "#2a2d33", camera: "#2a2d33"}
  steps:
    - {name: catalog,   run: tools/check_catalog.py}
    - {name: materials, run: tools/build_materials.py}
    - {name: designs,   run: tools/summarize_designs.py, needs: [catalog, materials]}
    - {name: cad,       run: cad/build.py, needs: [catalog, materials]}
  site:
    title: Gyropup
    tagline: A friendly self-balancing wheel-legged robot, and the closed-loop tool that designs, simulates and builds it
    notice: Private. Closed source for now.
    accent: "#e8892b"
    milestones: docs/milestones.yaml
    decisions: docs/decisions.yaml
    designs: exports/designs.json
    pages: [README.md, "docs/*.md", "research/*.md", catalog/SCHEMA.md]
    theme: hud
    nav:
      - {id: overview, title: Overview, href: site/}
      - {id: design, title: Design, href: designer/}
      - {id: simulate, title: Simulate, href: designer/sim.html}
      - {id: results, title: Results, href: designer/results.html}
      - {id: decisions, title: Decisions, href: "site/#decisions"}
      - {id: docs, title: Docs, href: "site/#documents"}
      - {id: repo, title: Repository, href: "https://github.com/Valpatel/gyropup"}
    links:
      - {title: Open the designer, href: designer/}
      - {title: Simulator, href: designer/sim.html}
      - {title: Results, href: designer/results.html}
      - {title: Architecture, href: site/pages/docs-architecture-md.html}
