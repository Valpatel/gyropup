# cad-agent project definition (toolkit: Valpatel/cad-agent). Run from this directory:
#   .venv/bin/cad-agent build          # the leg (CAD, renders, print plan)
#   .venv/bin/cad-agent site --serve   # local dashboard: progress, decisions, docs
cad:
  name: gyropup
  title: Gyropup
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  view:
    # the whole robot as drawn today (P3 body, five-bar legs, turret): cad/robot_view.py writes exports/robot/*.step
    parts: false
    extra: [{glob: "exports/robot/*.step"}]
    colors: {battery: "#fdb913", bay_doors: "#d98c26", brackets: "#454a52", bus_bars: "#c8743a", cameras: "#2a2d33",
             compute: "#5a6b7c", deck: "#33383f", ear_pods: "#3b4049", electronics: "#2b6cb0", frame: "#b4bac4",
             front_link: "#f5b82e", hardware: "#26282c", hip_frame: "#5f6670", hub: "#4a5058",
             leg_hardware: "#8f969f", lidar: "#2a2d33", motors: "#2a2d33", output_adapters: "#c9ced6",
             shell: "#cdd1db", stops: "#c8382f", turret_barrel: "#e8892b", turret_bought: "#3a3f47",
             turret_dark: "#3b3f46", turret_frame: "#b8bec7", turret_hopper: "#9cc9e8", tyre: "#1b1d21",
             upper_links: "#f5b82e", wheel_link: "#e9a21f"}
  steps:
    - {name: leg, run: cad/build_leg.py}
  # The design process (dossier + integrity gates) covers the turret first (docs/turret-sections.md, "The dossier"). `cad-agent build`
  # still builds only the leg; the turret's geometry record is built by the gates:
  #   .venv/bin/cad-agent gates --build          # cad/turret_dossier.py -> exports/dossier-geometry.json, every gate, the lint
  #   .venv/bin/python cad/turret_gates.py --dossier   # the turret's own gates (path, ammo range), bound to that record
  #   .venv/bin/cad-agent dossier                # the lint again, now with the turret's own verdicts
  #   .venv/bin/cad-agent check                  # fails on a failing, missing or stale verdict
  dossier: dossier/project.yaml
  gates:
    build: cad/turret_dossier.py
    declarations: dossier/gate-declarations.yaml
    jobs: 3
    timeout_s: 14400
    # parts drawn on their seats: 0.05 mm reads as touching; 0.2 mm^3 of integration noise on large curved booleans
    # (turret_gates.CONNECT_TOL)
    connectivity: {tol: {touch_mm: 0.05, volume_check_mm3: 0.2}}
    # the physics-settled pile (turret_gates.PILE_TOL and hopper_gate): MuJoCo's soft contacts sit 0.12-0.15 mm deep;
    # no surface probe (~30 s a ball against a cavity cut by the finned dial); support reported, not failed (a ball held
    # in an arch by its neighbours' friction reads as resting on nothing when only straight down is tested)
    containment: {tol: {touch_mm: 0.2, overlap_mm3: 1.0, contain_mm3: 1.0, volume_check_mm3: 0.2}, support: report,
                  support_mm: 0.5, probe: false}
    fasteners: {tol: {touch_mm: 0.05, volume_check_mm3: 0.2}}
    # The aim and the cartridge's mechanisms are one chain, which cadagent samples on the full grid: pan 35 (10 deg) x
    # tilt 6 (5 deg) x the dial 3 (0/45/90: its fins repeat every 90) x the flap 3 (-50/-25/0) x each flywheel 2 (0/360:
    # a solid of revolution, so one placement) = 7,560 poses; the pinion alone 13. Per-pose containment off (the load
    # rides with the hopper, T0.2).
    motion: {tol: {touch_mm: 0.05, volume_check_mm3: 0.2}, containment: false, max_poses: 8000,
             samples: {I-pan: 35, I-tilt: 6, I-feed: 3, I-flap: 3, I-wheel-l: 2, I-wheel-r: 2, I-pan-drive: 13}}
    assembly: {tol: {touch_mm: 0.05, volume_check_mm3: 0.2}, max_step_mm: 2.0}
  checks:
    - {id: turret-fea, title: Turret FEA (layer-aware SF targets), file: exports/turret/fea/summary.json,
       pass_key: verdict.all_ok}
    - {id: turret-launch, title: Turret launch ceiling (D68), file: exports/turret/launch/launch3d.json,
       pass_key: [ceiling.holds, ceiling.under_astm]}
  site:
    title: Gyropup
    tagline: A friendly self-balancing wheel-legged robot for foam-ball games, built leg first
    notice: Built by autonomous systems. Work in progress; CAD and simulation await physical validation.
    accent: "#e8892b"
    milestones: docs/milestones.yaml
    decisions: docs/decisions.yaml
    pages: [README.md, "docs/*.md", "research/*.md", catalog/SCHEMA.md]
    theme: light
    live_reload: {watch: [designer, exports, docs, cad]}   # pages reload as these change
    nav:
      - {id: home, title: Home, href: /}
      - {id: progress, title: Progress, href: designer/progress.html}
      - {id: build, title: Build, href: designer/build.html}
      - {id: overview, title: Overview, href: site/}
      - {id: simulate, title: Simulate, href: designer/sim.html}
      - {id: decisions, title: Decisions, href: "site/#decisions"}
      - {id: docs, title: Docs, href: "site/#documents"}
      - {id: repo, title: Repository, href: "https://github.com/Valpatel/gyropup"}
    links:
      - {title: Progress, href: designer/progress.html}
      - {title: Simulator, href: designer/sim.html}
      - {title: Architecture, href: site/pages/docs-architecture-md.html}
