# cad-agent project definition (toolkit: Valpatel/cad-agent). Run from this directory:
#   .venv/bin/cad-agent build          # the leg (CAD, renders, print plan)
#   .venv/bin/cad-agent site --serve   # local dashboard: progress, decisions, docs
cad:
  name: gyropup
  title: Gyropup
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  view:
    parts: false
    extra: [{glob: "exports/asm_*.step", strip: "asm_"}]
    colors: {chassis: "#5a5f68", battery_cradle: "#2f343c", yoke_bracket: "#b8bec7", hip_motor_plate: "#9aa3ad", knee_motor_plate: "#9aa3ad",
             hip_output_adapter: "#d6dbe1", knee_output_adapter: "#d6dbe1", thigh: "#f5b82e", shin: "#f5b82e", knee_crank: "#d6dbe1",
             wheel_adapter: "#d6dbe1", posts: "#d6dbe1", pushrod: "#c9ced6", head_saddle: "#3b3f46", face: "#2f343c",
             camera_cradle: "#3b3f46", lidar_hanger: "#3b3f46", j501_box: "#e8892b", battery: "#fdb913", hip_motor: "#3a3f47",
             knee_motor: "#3a3f47", wheel: "#1d2025", lidar: "#2a2d33", camera: "#2a2d33"}
  steps:
    - {name: leg, run: cad/build_leg.py}
  site:
    title: Gyropup
    tagline: A friendly self-balancing wheel-legged robot for foam-ball games, built leg first
    notice: Built by autonomous systems. Work in progress; CAD and simulation await physical validation.
    accent: "#e8892b"
    milestones: docs/milestones.yaml
    decisions: docs/decisions.yaml
    pages: [README.md, "docs/*.md", "research/*.md", catalog/SCHEMA.md]
    theme: light
    live_reload: {watch: [designer, exports, docs, cad]}   # pages reload as these change
    nav:
      - {id: home, title: Home, href: /}
      - {id: progress, title: Progress, href: designer/progress.html}
      - {id: build, title: Build, href: designer/build.html}
      - {id: overview, title: Overview, href: site/}
      - {id: simulate, title: Simulate, href: designer/sim.html}
      - {id: decisions, title: Decisions, href: "site/#decisions"}
      - {id: docs, title: Docs, href: "site/#documents"}
      - {id: repo, title: Repository, href: "https://github.com/Valpatel/gyropup"}
    links:
      - {title: Progress, href: designer/progress.html}
      - {title: Simulator, href: designer/sim.html}
      - {title: Architecture, href: site/pages/docs-architecture-md.html}
