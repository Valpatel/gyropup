     (rig/calibrate.py). On the public site it offers the emulator only; served by the bridge (rig/rs04_bridge.py,

<p class="gp-intro" data-test="intro">Gyropup's leg-motor tool. On gyropup.com it runs software motors only. For real

  address it prints. <a href="/site/pages/docs-rs04-motor-tool-md.html" data-test="readme-link">How it works</a> ·
