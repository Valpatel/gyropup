<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Results</title>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="loading.css" data-gyropup-loading>
<script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body>
<div id="fea-loading" style="position:fixed;top:calc(var(--appnav-h,0px) + 64px);left:12px;right:12px;z-index:20;max-width:520px;margin:auto" hidden><div class="gp-loading" role="status" aria-live="polite" aria-busy="true" data-state="loading"><span class="gp-loading-icon" aria-hidden="true"></span><span class="gp-loading-message">Loading the structural report…</span></div></div>
<script>if(new URLSearchParams(location.search).has('case'))document.getElementById('fea-loading').hidden=false;</script>
<div id="fea"><main style="position:relative;z-index:4;max-width:560px;margin:var(--appnav-h,0px) auto 0;padding:24px;max-height:calc(100vh - var(--appnav-h,0px));overflow:auto">
  <h1>Structural reports</h1>
  <p>Explore Gyropup’s structural reports, or open an earlier thigh study to try the interactive load, colour, and section controls.</p>
  <p><a href="../progress.html#fea">Latest structural reports</a></p>
  <p><a href="fea.html?case=../../exports/fea/thigh-T1.json&amp;title=Earlier%20thigh%20study">Explore the earlier thigh study in 3D</a></p>
</main></div>
<script type="module">
  try{
  const [{ mountFeaViewer },{ mountAppNav },{ createLoadingStatus }]=await Promise.all([import('./fea-viewer.js'),import('./appnav.js'),import('./loading.js')]);

  // fea.html?case=<url of a Study.export_viewer() JSON on this site, relative to this page>
  // Scriptable for links and screenshots: &load=1.5 &field=ratio|stress|sf|disp &spot=1 &clip=x:0.4 &exag=20 &panel=0
  // &play=1 &title=... &root=../../ (the project root from this page, for the app's top bar: a relative path) &nav=0
  // &back=<a page on this site>. Parameters that do not parse are ignored.
  const q = new URLSearchParams(location.search);
  // links stay on this site: no other origin and no javascript:, data: or similar URLs
  const sameOrigin = (h) => { try { const u = new URL(h, location.href); return u.origin === location.origin ? u : null; } catch { return null; } };
  const ROOT_OK = /^(?:\.\.?\/)*(?:[A-Za-z0-9_-][A-Za-z0-9._-]*\/)*$/;       // ../../ or ./ or designer/ ...
  const root = q.has('root') && ROOT_OK.test(q.get('root')) && !q.get('root').startsWith('//') ? q.get('root') : '../../';
  const finite = (k) => (q.has(k) && q.get(k).trim() !== '' && Number.isFinite(+q.get(k)) ? +q.get(k) : null);
  const caseUrl = q.has('case') ? sameOrigin(q.get('case')) : null;
  const back = (q.has('back') && sameOrigin(q.get('back'))) ? q.get('back') : `${root}site/`;
  if (q.get('nav') !== '0') void mountAppNav({ root, current: q.get('current') ?? '' });
  const el = document.getElementById('fea');
  const host=document.getElementById('fea-loading');host.replaceChildren();
  const loading=createLoadingStatus(host,{id:'fea-load-status'});
  if (!q.has('case')) {
    // The static entry links also remain useful to no-script browsers and Markdown readers.
  } else if (!caseUrl) {
    loading.fail('The case must be a JSON file on this site (a relative URL or this origin).');
  } else {
    let request=0;
    async function load(){
    const own=++request,token=loading.begin('Loading the structural report…');
    document.body.dataset.ready='0';let v=null;
    try {
      const name = decodeURIComponent(caseUrl.pathname.split('/').pop().replace(/\.json$/, ''));
      const title = q.get('title') ?? name;
      v = await mountFeaViewer(el, caseUrl.href, { title, back, backLabel: 'Project site', panel: q.get('panel') === '0' ? false : undefined,onProgress:message=>loading.update(message,token) });
      document.title = `${title}: FEA`;
    } catch (e) {
      if(own===request)loading.fail(`This structural report could not load. ${e.message}`,{token,onRetry:load});
    }
    if (v && own===request) {
      // each setter ignores what it cannot use (an unknown field or axis, a load that is not a number)
      if (q.has('field')) v.setField(q.get('field'));
      if (finite('load') !== null) v.setLoad(finite('load'));
      if (finite('exag') !== null) v.setExaggeration(finite('exag'));
      if (q.has('clip')) { const [a, f] = q.get('clip').split(':'); v.setClip(a, f === undefined || f === '' ? 0.5 : +f); }
      if (finite('spot') !== null) v.flyTo(finite('spot') - 1, { instant: true });
      if (q.get('play') === '1') v.play(true);
      window.__fea = v;
      document.body.dataset.ready = '1';loading.ready(token);
    }
    }
    await load();
  }
  }catch(error){
    console.warn('Page startup failed:',error.message);
    // Only a failed bootstrap reloads. Data/model retries above retain the existing scene.
    if(document.body.dataset.ready!=='1'){
      const host=document.getElementById('fea-loading');host.hidden=false;
      host.innerHTML='<div class="gp-loading" data-bootstrap-error data-state="error" role="status" aria-live="polite" aria-busy="false"><span class="gp-loading-icon" aria-hidden="true"></span><span class="gp-loading-message">The structural viewer could not start. Reload the page to try again.</span><span class="gp-loading-actions"><button type="button" data-bootstrap-retry>Reload page</button></span></div>';
      host.querySelector('[data-bootstrap-retry]').onclick=()=>location.reload();
    }
  }
</script>
</body>
</html>
