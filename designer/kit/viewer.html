<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="loading.css" data-gyropup-loading>
<script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <header id="topbar"><span class="glyph"></span><h1 id="title">Model</h1><span class="hud-tag">3D view</span><span class="spacer"></span>
    <a class="hud-tag" id="back" href="../../site/">Project site</a></header>
  <main id="stage-overlay"><div id="viewer-loading"><div class="gp-loading gp-loading--overlay" role="status" aria-live="polite" aria-busy="true" data-state="loading"><span class="gp-loading-icon" aria-hidden="true"></span><span class="gp-loading-message">Loading the model…</span></div></div><div class="hud-hint">DRAG · ORBIT // SCROLL · ZOOM // RIGHT-DRAG · PAN</div></main>
  <aside id="panel"><p class="hud-note">Explore the real Gyropup assembly in the <a href="../sim.html?run=none">playground</a>. Exported CAD assemblies can also open here with an explicit model manifest.</p></aside>
</div>
<script type="module">
  try{
  const [{ createViewer },{ createLoadingStatus }]=await Promise.all([import('./viewer.js'),import('./loading.js')]);

  const q = new URLSearchParams(location.search);
  // Gyropup's real assembly lives in the playground; this reusable viewer needs an explicit export.
  if (!q.has('manifest')) {
    location.replace('../sim.html?run=none');
  } else {
    const host=document.getElementById('viewer-loading');host.replaceChildren();
    const loading=createLoadingStatus(host,{overlay:true,id:'viewer-load-status',onRetry:load});
    const panel=document.getElementById('panel'),manifestUrl=q.get('manifest');
    let request=0;
    async function load(){
      const own=++request,token=loading.begin('Loading the model…');document.body.dataset.ready='0';
      try{
        const controls=document.createElement('div');
        const v=await createViewer({app:document.getElementById('app'),panel:controls,title:document.getElementById('title'),manifestUrl,
          onProgress:message=>loading.update(message,token)});
        if(own!==request)return;
        panel.replaceChildren(...controls.childNodes);
        if(q.has('explode'))v.setExplode(+q.get('explode'));
        if(q.has('section'))v.setSection(+q.get('section'));
        if(q.has('view'))[...document.querySelectorAll('.hud-btn')].find(b=>b.textContent===q.get('view').toUpperCase())?.click();
        if(q.get('panel')==='0')panel.style.display='none';
        window.__viewer=v;document.body.dataset.ready='1';loading.ready(token);
      }catch(error){
        if(own!==request)return;
        loading.fail(`This model could not load. ${error.message}`,{token,onRetry:load});
      }
    }
    await load();
  }
  }catch(error){
    console.warn('Page startup failed:',error.message);
    // Only a failed bootstrap reloads. Data/model retries above retain the existing scene.
    if(document.body.dataset.ready!=='1'){
      const host=document.getElementById('viewer-loading');host.hidden=false;
      host.innerHTML='<div class="gp-loading gp-loading--overlay" data-bootstrap-error data-state="error" role="status" aria-live="polite" aria-busy="false"><span class="gp-loading-icon" aria-hidden="true"></span><span class="gp-loading-message">The model viewer could not start. Reload the page to try again.</span><span class="gp-loading-actions"><button type="button" data-bootstrap-retry>Reload page</button></span></div>';
      host.querySelector('[data-bootstrap-retry]').onclick=()=>location.reload();
    }
  }
</script>
</body>
</html>
