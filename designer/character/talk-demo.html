<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyropup Talk Demo</title>
<link rel="stylesheet" href="../kit/hud.css">
<script type="importmap">{"imports": {"three": "../kit/vendor/three/three.module.min.js", "three/addons/": "../kit/vendor/three/addons/"}}</script>
<style>
  #panel .body { display: grid; gap: 8px; }
  #panel .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #panel .hud-btn { width: 100%; }
  #topbar h1 { min-width: 0; }
  @media(max-width:820px), (max-height:450px) and (max-width:1024px) {
    #hud { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr) 46vh; grid-template-areas: 'topbar' 'stage' 'panel'; }
    #panel { margin: 0 8px 8px; }
    .hud-panel-tab { display: none; }
    body .gp-dock { left: 8px; right: 8px; width: auto; bottom: calc(46vh + 6px); }
    #topbar .demo-tag { display: none; }
    #topbar { gap: 8px; flex-wrap: nowrap; }
    #topbar .hud-pill, #panel .hud-btn { min-height: 44px; }
    #hud.panel-collapsed { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); grid-template-areas: 'topbar' 'stage'; }
    body:has(#hud.panel-collapsed) .gp-dock { bottom: 12px; }
    .hud-hint { display: none; }
  }
  @media(max-height:450px) {
    body .gp-bubble { max-width: min(260px, calc(50vw - 24px)); }
  }
  #svc { white-space: pre-line; font: 11px var(--font-mono); color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <header id="topbar">
    <span class="glyph"></span><h1>Gyropup talk</h1>
    <span class="hud-tag demo-tag">character demo</span>
    <span class="spacer"></span>
  </header>
  <main id="stage-overlay">
    <div class="hud-hint">DRAG · ORBIT // SCROLL · ZOOM // RIGHT-DRAG · PAN</div>
  </main>
  <aside id="panel">
    <details class="hud-section" open>
      <summary><span class="tick"></span>Sim events<span class="note">react(event)</span></summary>
      <div class="body grid2" id="events"></div>
    </details>
    <details class="hud-section" open>
      <summary><span class="tick"></span>Say<span class="note">say(text, {mood})</span></summary>
      <div class="body grid2" id="moods"></div>
    </details>
    <details class="hud-section" open>
      <summary><span class="tick"></span>Services</summary>
      <div class="body"><button class="hud-btn" id="detect">Detect services</button><div id="svc">not checked yet</div></div>
    </details>
  </aside>
</div>
<script type="module">
  import * as THREE from 'three';
  import { createStage } from '../kit/stage.js';
  import { mountTalk } from './talk.js';
  import { createSfx } from '../sfx.js';
  import { buildRobotV2 } from '../robot_v2.js';
  import { createEyes } from './eyes.js';
  import { collapsiblePanel, overlayInsets, section, slider } from '../kit/panel.js';

  const stage = createStage(document.getElementById('app'), { height: 1 });
  const eyes=createEyes({iris:'#55e9ff'}),setMood=eyes.set.bind(eyes);
  eyes.set=mood=>{setMood(mood);document.body.dataset.mood=mood;};
  const robot=await buildRobotV2('../../',{eyes});
  stage.root.add(robot.group);
  const bounds=new THREE.Box3();robot.group.updateMatrixWorld(true);
  robot.group.traverseVisible(object=>{if(object.isMesh){object.geometry.computeBoundingBox();bounds.union(object.geometry.boundingBox.clone().applyMatrix4(object.matrixWorld));}});
  // The face is below the turret. A bubble anchored only to the face can cover
  // the current head assembly; use its full visual envelope for placement.
  const envelope=bounds.clone().expandByScalar(.02),size=envelope.getSize(new THREE.Vector3());
  const speechAnchor=new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z),new THREE.MeshBasicMaterial());
  envelope.getCenter(speechAnchor.position);speechAnchor.visible=false;stage.root.add(speechAnchor);

  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  stage.onFrame((t,dt)=>{
    robot.setPose({height:.6+(motion.matches?0:.02*Math.sin(t*1.3)),pitch:motion.matches?0:.01*Math.sin(t*.7)});
    if(!motion.matches)eyes.step(t,dt);
    eyes.draw();robot.turret.step(dt);
  });
  stage.start();

  const sfx = createSfx();
  const talk = mountTalk({ stage, eyes, audio: { enabled: sfx.enabled, volume: sfx.volume }, getHead: () => speechAnchor, root: '../../' });
  const sound = document.createElement('button'); sound.className = 'hud-pill';
  const paintSound = () => { sound.textContent = `SOUND ${sfx.enabled ? 'ON' : 'OFF'}`; sound.classList.toggle('on', sfx.enabled); };
  sound.onclick = () => sfx.setEnabled(!sfx.enabled);
  sfx.onChange(audio => { talk.setAudio(audio); paintSound(); }); paintSound();
  document.getElementById('topbar').append(sound);
  slider(section(document.getElementById('panel'), 'Sound', { note: 'effects + voice' }), {
    label: 'Volume', min: 0, max: 1, step: 0.01, value: sfx.volume, fmt: value => `${Math.round(value * 100)}%`, onInput: value => sfx.setVolume(value),
  });
  window.__sfx = sfx;
  window.__talk = talk;
  const hud = document.getElementById('hud'), panel = document.getElementById('panel');
  const phone = () => matchMedia('(max-width:820px), (max-height:450px) and (max-width:1024px)').matches;
  let userMoved = false;
  stage.controls.addEventListener('start', () => { userMoved = true; });
  const speechBubble=document.querySelector('.gp-bubble');

  function layout() {
    const ins = overlayInsets(hud), dock = talk.dock.el.getBoundingClientRect();
    ins.bottom = Math.max(ins.bottom, innerHeight - dock.top + 8);
    if(innerHeight<=450) ins.left=Math.max(ins.left,innerWidth/2);
    else if(phone()) ins.top+=speechBubble.getBoundingClientRect().height+24;
    stage.setInsets(ins);
    if (!userMoved) stage.fitView(bounds, { margin: 1.15 });
  }
  const controlsPanel = collapsiblePanel(hud, panel, { key: 'talk-demo-controls', onChange: collapsed => {
    if (phone() && !collapsed) talk.dock.collapse(true);
    layout();
  } });
  window.__talkDemo = { stage, controlsPanel, robot };
  if (phone()) controlsPanel.set(true);
  // On a phone, the event controls and conversation take turns using the bottom tray.
  new MutationObserver(() => {
    if (phone() && !talk.dock.isCollapsed()) controlsPanel.set(true);
    layout();
  }).observe(talk.dock.el, { attributes: true, attributeFilter: ['class'] });
  new ResizeObserver(layout).observe(talk.dock.el);
  new ResizeObserver(layout).observe(speechBubble);
  let compact=phone();
  window.addEventListener('resize',()=>{const next=phone();if(next&&!compact)controlsPanel.set(true);compact=next;layout();});
  layout();

  const btn = (parent, label, fn) => { const b = document.createElement('button'); b.className = 'hud-btn'; b.textContent = label; b.onclick = fn; parent.appendChild(b); };
  for (const ev of ['hello', 'fire', 'hit', 'down', 'miss', 'reload', 'empty', 'fall', 'low_battery']) btn(document.getElementById('events'), ev, () => talk.react(ev));
  const lines = { happy: 'Wheee! That was fun!', curious: 'Ooh, what is that?', sleepy: 'Yawn... charger time?', grumpy: 'Hey! Foam balls at targets only!', surprised: 'Whoa! Did you see that?', focused: 'Locking on to the target...' };
  for (const [mood, line] of Object.entries(lines)) btn(document.getElementById('moods'), mood, () => talk.say(line, { mood }));
  document.getElementById('detect').onclick = async () => {
    const s = await talk.detect(true);
    document.getElementById('svc').textContent =
      `voice: ${s.tts.ok ? `Piper ${s.tts.voice ?? ''} at ${s.tts.base}` : s.tts.name}\nears:  ${s.stt.ok ? 'Whisper ' + s.stt.base : s.stt.name}\nbrain: ${s.llm.ok ? s.llm.base + ' ' + s.llm.model : 'scripted'}`;
  };

  setTimeout(() => talk.say('Hi! I am Gyropup. Want to play a target game?', { mood: 'happy', hold: 60000 }), 400);
</script>
</body>
</html>
