<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyropup Simulator</title>
<link rel="stylesheet" href="kit/hud.css">
<script type="importmap">{"imports": {"three": "./kit/vendor/three/three.module.min.js", "three/addons/": "./kit/vendor/three/addons/"}}</script>
<style>
  #design-select, #run-select { font: 12px var(--font-mono); background: var(--surface-2); color: var(--text); border: 1px solid var(--hairline); border-radius: 6px; padding: 5px 8px; max-width: 240px; }
  .stage-card h2 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stage-card .big { font-size: 22px; font-weight: 700; }
  .stage-card .fold { cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .stage-card .fold .chev { margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
  .stage-card.min .fold { margin: 0; }
  .stage-card.min .fold .chev { transform: rotate(-45deg); }
  .stage-card.min .hud-readouts { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <header id="topbar">
    <span class="hud-tag">SIMULATOR</span>
    <select id="design-select" aria-label="Design"></select>
    <select id="run-select" aria-label="Physics run"></select>
    <span class="spacer"></span>
    <button class="hud-pill on" id="alive"><span class="dot"></span>ALIVE</button>
  </header>
  <main id="stage-overlay">
    <div class="hud-card stage-card" id="summary"></div>
    <div class="hud-hint">DRAG · ORBIT // SCROLL · ZOOM // RIGHT-DRAG · PAN</div>
  </main>
  <aside id="panel"></aside>
</div>
<script type="module" src="sim.js"></script>
</body>
</html>
