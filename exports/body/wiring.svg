<text x="558" y="590" font-size="11" fill="#2ca02c">W33 frame bond 14 AWG</text>
<rect x="20" y="600" width="330" height="140" rx="6" fill="#e8f0ff" stroke="#333" stroke-width="1.5"/>
<text x="28" y="617" font-weight="bold">MCU board (on the power plate)</text>
<text x="28" y="633" fill="#333" font-size="11">Nucleo-G474RE: FDCAN1/2/3 = buses A/B/C</text>
<text x="28" y="647" fill="#333" font-size="11">CAN Pal x 3 (120 Ohm on: the bus ends)</text>
<text x="28" y="661" fill="#333" font-size="11">INA228 on I2C: pack V and I, high side (W30-32)</text>
<text x="28" y="675" fill="#333" font-size="11">the cut-off, current limit, regen clamp (D65)</text>
<text x="28" y="689" fill="#333" font-size="11">STOP loop in (radio relay, closed = run)</text>
<text x="28" y="703" fill="#333" font-size="11">5 V from the buck (W28-29)</text>
<text x="380" y="614" font-size="12" font-weight="bold" fill="#1f5fbf">CAN A</text>
<line x1="430" y1="610" x2="1380" y2="610" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 3"/>
<text x="436" y="626" font-size="11" fill="#1f5fbf">MCU FDCAN1 (CAN Pal 1, 120 Ohm on) → RS-04 left front → RS-04 left rear (120 Ohm at its plug)  (1 Mbit/s, the left leg)</text>
<text x="380" y="650" font-size="12" font-weight="bold" fill="#1f5fbf">CAN B</text>
<line x1="430" y1="646" x2="1380" y2="646" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 3"/>
<text x="436" y="662" font-size="11" fill="#1f5fbf">MCU FDCAN2 (CAN Pal 2, 120 Ohm on) → RS-04 right front → RS-04 right rear (120 Ohm at its plug)  (1 Mbit/s, the right leg)</text>
<text x="380" y="686" font-size="12" font-weight="bold" fill="#1f5fbf">CAN C</text>
<line x1="430" y1="682" x2="1380" y2="682" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 3"/>
<text x="436" y="698" font-size="11" fill="#1f5fbf">MCU FDCAN3 (CAN Pal 3, 120 Ohm on) → VESC left → VESC right → J501 can0 (its own 120 Ohm on)  (1 Mbit/s: wheels, the computer)</text>
<text x="20" y="800" font-size="11" fill="#333">The radio stop (D37, D55): the ER3C-i receiver (failsafe: no pulses) drives one Pololu RC relay switch; its contact feeds the coil of the stop relay (Omron G2RL-2, DPDT, 12 V), whose other </text>
<text x="20" y="815" font-size="11" fill="#333">end goes to ground through the MCU's MOSFET. The relay holds only while the radio says run AND the MCU says run. Pole A is the turret's dry safety loop (TM pins 7, 8: the turret cuts its </text>
<text x="20" y="830" font-size="11" fill="#333">flywheels and dial in 20 ms), pole B is in the turret's bus branch (W22, W34: the independent cut); the MCU senses the coil voltage and sits the robot down when the radio drops, and opens </text>
<text x="20" y="845" font-size="11" fill="#333">the relay itself when the robot sits. The main switch is the hard off. </text>
<text x="20" y="850" font-size="11" fill="#333">Fuses: Littelfuse MINI 58V (0997) in inline holders rated 32 V: the fuse interrupts (1 kA at 58 V); label every holder "58 V fuses only" and pull a fuse only with the pack unplugged.</text>
<text x="20" y="870" font-size="11" fill="#333">Twist every CAN pair (22 AWG); keep the shunt's sense pair away from the 10 AWG runs; crimp, never solder-tin, a wire that goes into a screw terminal (ferrules).</text>
</svg>