<text x="28" y="333" fill="#333" font-size="11">the packs come out and charge</text>
<text x="28" y="347" fill="#333" font-size="11">on DeWalt's own chargers</text>
<text x="28" y="361" fill="#333" font-size="11">(no charge port, D65)</text>
