<text x="20" y="28" font-size="18" font-weight="bold">Gyropup body P0: power and CAN wiring</text>
<text x="20" y="46" fill="#555">Two DCB609 in series (10S, D65): 36.0 V nominal, 41.0 V full, 30.0 V empty. W-numbers are the rows of docs/body-electrical.md (cad/body_wiring.py). Red +, black -, white sense, green frame bond.</text>
<rect x="20" y="70" width="210" height="210" rx="6" fill="#fff7e6" stroke="#333" stroke-width="1.5"/>
<text x="28" y="87" font-weight="bold">Battery bay (belly)</text>
<text x="28" y="103" fill="#333" font-size="11">two DeWalt DCB609, 20 V mode</text>
<text x="28" y="117" fill="#333" font-size="11">on two Terrafirma rail adapters</text>
<text x="28" y="131" fill="#333" font-size="11">in series (W2: an XT90 link)</text>
<text x="28" y="145" fill="#333" font-size="11">10S3P, 30-41 V, 360 Wh rated</text>
<text x="28" y="159" fill="#333" font-size="11">no BMS the robot can read:</text>
<text x="28" y="173" fill="#333" font-size="11">the firmware cuts off at 30 V</text>
<text x="28" y="187" fill="#333" font-size="11"></text>
<text x="28" y="201" fill="#333" font-size="11">XT90-S female on the bay's lead</text>
<rect x="20" y="300" width="210" height="80" rx="6" fill="#fff7e6" stroke="#333" stroke-width="1.5"/>
