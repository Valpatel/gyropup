<style>
  svg{display:block;width:100%;max-width:640px;height:auto;background:#10182f;color:#f5e7c6}
  text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#f5e7c6}
  .brand{font-size:22px;font-weight:700;letter-spacing:.3px}.method{font-size:21px;font-weight:700;letter-spacing:-.3px;text-anchor:middle}.nav{font-size:20px;font-weight:600;letter-spacing:-.5px;text-anchor:middle;fill:#cadbd3}
  .crisp{shape-rendering:crispEdges}.far{animation:drift 24s ease-in-out infinite alternate}.lamp{animation:warmth 9s ease-in-out infinite alternate}.holo{animation:hover 8s ease-in-out infinite}.signal{animation:signal 16s linear infinite}.return{animation:return 16s linear infinite}.lens{animation:review 14s ease-in-out infinite}
  .route{fill:none;stroke:#91b7b3;stroke-width:2;stroke-linejoin:miter}.link .hit{fill:transparent}.link:hover .hit,.link:focus .hit{fill:#8ff1df;fill-opacity:.09}.link:hover .nav,.link:focus .nav{fill:#ffe0a1}.link:focus{outline:none}.link:focus .hit{stroke:#ffe0a1;stroke-width:2}
  @keyframes drift{to{transform:translateX(-3px)}}@keyframes warmth{to{opacity:.68}}@keyframes hover{50%{transform:translateY(-2px)}}@keyframes signal{0%,8%{transform:translateX(0);opacity:0}12%{opacity:1}85%{opacity:1}95%,100%{transform:translateX(450px);opacity:0}}@keyframes return{0%,49%{opacity:0;transform:translateX(0)}54%{opacity:.65}90%{opacity:.65}100%{opacity:0;transform:translateX(-450px)}}@keyframes review{0%,70%,100%{transform:translateX(0)}35%{transform:translateX(3px)}}
  @media(prefers-reduced-motion:reduce){.far,.lamp,.holo,.signal,.return,.lens{animation:none}.signal{opacity:.8}.return{opacity:.45}}
</style>
