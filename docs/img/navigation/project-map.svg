<g transform="translate(86 377)" fill="none" stroke="#ffc461" stroke-width="2"><path d="M0 1H34V30H0ZM7 8H27M7 15H22M7 22H27"/></g>
<text class="label" x="83" y="428">Understand the design ↗</text><text class="sub" x="83" y="448">Decisions · CAD · simulation · tests</text></a>
