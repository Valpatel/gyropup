<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">A workshop that learns: cad-agent and Gyropup</title>
<desc id="desc">An original sixteen-bit-inspired night workshop. Good sources feed virtual and physical tests; review returns useful methods to a reusable library. cad-agent and Gyropup evolve through that loop. This is a conceptual method illustration, not a record of completed hardware qualification. Four links lead to Play, Build, Understand and Contribute; ordinary text links accompany the image.</desc>
