<g transform="translate(86 250)" fill="none" stroke="#ffc461" stroke-width="2"><path d="M0 9L17 0L34 9V28L17 37L0 28ZM0 9L17 18L34 9M17 18V37"/></g>
<text class="label" x="83" y="305">Build and inspect ↗</text><text class="sub" x="83" y="325">Parts · print candidates · hardware</text></a>
