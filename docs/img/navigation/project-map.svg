<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 636" role="img" aria-labelledby="title desc">
<title id="title">Explore Gyropup</title>
<desc id="desc">Four paths through the project: explore the robot, build and inspect, understand the engineering, and contribute. Each card links to its published entry point. Equivalent text links accompany this image in the documentation map.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173d50"/><stop offset="1" stop-color="#0b202d"/></linearGradient><linearGradient id="card"><stop stop-color="#244b60"/><stop offset="1" stop-color="#173647"/></linearGradient></defs>
<style>text{font-family:system-ui,sans-serif;fill:#f5f2e9}.sub{font-size:14px;fill:#bcd1d8}.label{font-size:20px;font-weight:650}.card{fill:url(#card);stroke:#57717c;stroke-width:1}.dot{fill:#ffc461;animation:pulse 4s ease-in-out infinite}.link:focus .card,.link:hover .card{stroke:#ffc461;stroke-width:2}.link:focus{outline:none}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}</style>
<rect width="420" height="636" rx="25" fill="url(#bg)"/>
<path d="M40 66H380M42 128V558" fill="none" stroke="#66808a" stroke-width="1"/>
<text x="27" y="39" font-size="25" font-weight="700">One robot. Four ways in.</text>
<text class="sub" x="27" y="87">Follow a path, then open its evidence.</text>
<a class="link" href="https://gyropup.com/designer/sim.html" aria-label="Explore the robot in the browser playground">
<rect class="card" x="62" y="111" width="334" height="105" rx="15"/><circle class="dot" cx="42" cy="146" r="5"/>
<g transform="translate(83 132)" fill="none" stroke="#ffc461" stroke-width="2"><circle cx="11" cy="23" r="8"/><circle cx="42" cy="23" r="8"/><path d="M11 23L20 5H34L42 23M20 5L28 23L34 5"/></g>
