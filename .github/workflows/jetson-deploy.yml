# The robot Jetson's deployment (software/deploy/jetson): install.sh's dry run, a staged install, idempotence, stable names, LAN
# mode, shellcheck; the hardware folders' records (hardware/README.md) and the RS-04 inventory. No Jetson is needed.
name: jetson-deploy

on:
  pull_request:
    paths:
      - 'software/deploy/**'
      - 'hardware/**'
      - 'software/control/rig/rs04*.py'
      - 'tests/control/rig/test_rs04_inventory.py'
      - 'tests/control/rig/test_rs04_vectors.py'
      - 'tests/control/rig/test_rs04_bridge.py'
      - 'tools/evidence/interfaces/check-hardware.py'
      - 'tests/hardware/inventory/test_check_hardware.py'
      - 'software/firmware/balance/include/**'   # the hardware configs' sourced values
      - 'software/firmware/balance/src/**'
      - 'docs/**'                       # the folders' links point into these
      - 'references/**'
      - 'catalog/**'
      - 'software/site/designer/kit/rs04/**'
      - 'hardware/exports/**'
      - '.github/workflows/jetson-deploy.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # JetPack 6's Python: the bridge and the checks must run on it
      - name: install.sh (dry run, staged install, idempotence, names, LAN mode, shellcheck)
        run: python3 software/deploy/jetson/test_install.py -v
      - name: The hardware folders and the RS-04 inventory
        run: |
          python3 tools/evidence/interfaces/check-hardware.py
          python3 -m unittest tests/hardware/inventory/test_check_hardware.py -v
          python3 -m unittest tests.control.rig.test_rs04_inventory -v
      - name: The RS-04 bridge and profiles on JetPack's Python
        run: python3 -m unittest tests.control.rig.test_rs04_vectors tests.control.rig.test_rs04_bridge -v
