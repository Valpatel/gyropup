name: PAN architecture comparison
on:
  pull_request:
    paths:
      - 'research/protection/*practical*'
      - 'hardware/carrier-pan-protection/calculate.py'
      - 'hardware/carrier-pan-protection/circuit_design.py'
      - '.github/workflows/pan-architecture.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/protection/calculate_practical_architecture.py --check
      - run: python -m unittest discover -s research/protection -p 'test_practical_architecture.py' -v
