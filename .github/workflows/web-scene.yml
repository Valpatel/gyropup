name: Playground and presentation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  retained-fit-job:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Stays on v0.4.2: the retained fit jobs record the SHA-256 of the cad-agent helpers that sliced them
      # (tools/package-fit-job.py TOOLKIT_HELPERS), and --verify refuses any other toolkit. It moves when a fit job is
      # regenerated, not with the FEA records (which run on v0.6.0, 50d4921, issue 29).
      - uses: actions/checkout@v4
        with:
          repository: Valpatel/cad-agent
          ref: 2ad426943ce2c7232875e105e50810849f9a3e5e # v0.4.2
          path: .cad-agent-toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/fit-job-requirements.txt
      - name: Check retained fit evidence without slicing or CAD generation
        env:
          PYTHONPATH: .cad-agent-toolkit/src
        run: |
          python tools/test-fit-job.py
          python tools/package-fit-job.py --verify exports/leg/rs04-fit-job
          python tools/test-survey-fit-job.py
          python tools/package-survey-fit-job.py --verify exports/turret/shaft-survey-fit-job
  privacy:
    # No home paths, fleet host names, private addresses or private repository names in the tracked files or the
    # built site, beyond the shrink-only tools/privacy-ratchet.txt (issue 141). Reports never print the strings.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build's legacy mesh migration, and the base branch's ratchet for the shrink-only check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check tracked files and dist/
        env:
          # optional: extra private names, kept out of the repository (empty when the secret is unset)
          GYROPUP_PRIVATE_NAMES: ${{ secrets.GYROPUP_PRIVATE_NAMES }}
        run: npm run test:privacy
  browser-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mechanism
            commands: |
              python3 tools/test-print-provenance.py
              python3 tools/test-rs04-lug-stacks.py
              python3 tools/test-rs04-support-probe.py
              python3 research/thread-mating-2026-10-29/test_wrapper.py
              python3 tools/test-base-board-interfaces.py
              python3 tools/test-carrier-connector-inputs.py
              python3 tools/test-carrier-connector-pose.py
              python3 tools/test-carrier-connector-support.py
              python3 research/carrier-insert-fit/verify.py
              python3 research/carrier-insert-fit/test_guards.py
              python3 research/insert-joints/test_inventory.py
              python3 research/leg-preprint/test_screen.py
              npm run test:turret
              npm run test:camera
              npm run test:models
              npm run test:legs
          - suite: playground
            commands: |
              npm run test:interactions
              npm run test:robot
              npm run test:sim
              npm run test:demo
          - suite: presentation
            commands: |
              npm run test:notice
              npm run test:hero
              npm run test:viewers
              npm run test:file-viewer-theme
              npm run test:audio
              npm run test:web
              npm run test:progress
              npm run test:landing-loop
              npm run test:status-board
              npm run test:timeline
              npm run test:doc-pages
              npm run test:walls
              npm run test:highlights
              npm run test:highlight-integration
              npm run test:markdown
              npm run test:cache
              npm run test:diagrams
              npm run test:services
              npm run test:preview
          - suite: loading
            commands: |
              npm run test:part-media
              npm run test:portal-data
              npm run test:loading-sim
              npm run test:loading-portal
              npm run test:loading-hero
          - suite: build-portal
            commands: |
              npm run test:build-portal
              npm run test:carrier-inspection
              npm run test:study-media
              npm run test:highlight-media
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reproduce the pinned legacy mesh coordinate migration.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: matrix.suite == 'build-portal'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - name: Validate ${{ matrix.suite }}
        env:
          PORT: 8879
          PLAYWRIGHT_CHANNEL: chromium
          SITE_URL: http://127.0.0.1:8879
        run: |
          GYROPUP_PREVIEW_PARENT_PID=$$ node tools/serve-site.mjs --ephemeral > /tmp/gyropup-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            /tmp/gyropup-*
            test-results
