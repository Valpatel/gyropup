name: Playground and presentation
on:
  pull_request:
  push:
    branches: [main]
  # Scheduled work is only the cheap drift/parity check below. Ordinary PR/main
  # browser commands, thresholds and job limits remain unchanged.
  schedule:
    - cron: '17 6 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  retained-fit-job:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Stays on v0.4.2: the retained fit jobs record the SHA-256 of the cad-agent helpers that sliced them
      # (tools/evidence/manufacturing/package-fit-job.py TOOLKIT_HELPERS), and --verify refuses any other toolkit. It moves when a fit job is
      # regenerated, not with the FEA records (which run on v0.6.0, 50d4921, issue 29).
      - uses: actions/checkout@v4
        with:
          repository: Valpatel/cad-agent
          ref: 2ad426943ce2c7232875e105e50810849f9a3e5e # v0.4.2
          path: .cad-agent-toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/evidence/manufacturing/fit-job-requirements.txt
      - name: Check retained fit evidence without slicing or CAD generation
        env:
          PYTHONPATH: .cad-agent-toolkit/src
        run: |
          python tests/hardware/manufacturing/test-fit-job.py
          python tools/evidence/manufacturing/package-fit-job.py --verify hardware/exports/leg/rs04-fit-job
          python tests/hardware/manufacturing/test-survey-fit-job.py
          python tools/evidence/manufacturing/package-survey-fit-job.py --verify hardware/exports/turret/shaft-survey-fit-job
  privacy:
    if: github.event_name != 'schedule'
    # No home paths, fleet host names, private addresses or private repository names in the tracked files or the
    # built site, beyond the shrink-only tools/site/privacy-ratchet.txt (issue 141). Reports never print the strings.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build's legacy mesh migration, and the base branch's ratchet for the shrink-only check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check tracked files and dist/
        env:
          # optional: extra private names, kept out of the repository (empty when the secret is unset)
          GYROPUP_PRIVATE_NAMES: ${{ secrets.GYROPUP_PRIVATE_NAMES }}
        run: npm run test:privacy
  browser-validation:
    if: github.event_name != 'schedule'
    # A stable check name per suite (the default name embeds the whole command list), so main's protection can require it.
    name: browser-validation (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    # Match the locked Playwright release and the already verified cad-agent CI image.
    # Browser/system dependencies are baked in; retain the same test and job bounds.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mechanism
            commands: |
              python3 tests/hardware/manufacturing/test-motor-day-render-inputs.py
              python3 tests/hardware/manufacturing/test-print-provenance.py
              python3 tests/hardware/interfaces/test-rs04-lug-stacks.py
              python3 tests/hardware/interfaces/test-rs04-dowel-protrusion.py
              python3 tests/hardware/interfaces/test-rs04-support-probe.py
              python3 docs/research/thread-mating-2026-10-29/test_wrapper.py
              python3 tests/hardware/interfaces/test-base-board-interfaces.py
              python3 tests/hardware/interfaces/test-carrier-connector-inputs.py
              python3 tests/hardware/interfaces/test-carrier-connector-pose.py
              python3 tests/hardware/interfaces/test-carrier-connector-support.py
              python3 docs/research/carrier-insert-fit/verify.py
              python3 docs/research/carrier-insert-fit/test_guards.py
              python3 docs/research/insert-joints/test_inventory.py
              python3 docs/research/insert-joints/test_phase2.py
              python3 docs/research/snap-fits/test_snaps.py
              python3 docs/research/leg-preprint/test_screen.py
              python3 tests/evidence/test-turret-fea-refresh.py
              python3 software/simulation/test_motor_thermal.py
              npm run test:turret
              npm run test:camera
              npm run test:models
              npm run test:legs
          - suite: playground
            commands: |
              npm run test:interactions
              npm run test:rs04
              npm run test:motor-tool
              npm run test:robot
              npm run test:gamepad
              npm run test:sim
              npm run test:demo
          - suite: presentation-controls
            commands: |
              npm run test:notice
              npm run test:hero
              npm run test:viewers
              npm run test:file-viewer-theme
              npm run test:audio
              npm run test:voice
              npm run test:web
          - suite: presentation-content
            commands: |
              npm run test:progress
              npm run test:landing-loop
              npm run test:status-board
              npm run test:timeline
              npm run test:doc-pages
              npm run test:walls
              npm run test:theme
              npm run test:highlights
              npm run test:highlight-integration
              npm run test:markdown
              npm run test:cache
              npm run test:diagrams
              npm run test:services
              npm run test:preview
          - suite: loading
            commands: |
              npm run test:part-media
              npm run test:portal-data
              npm run test:leg-limits
              npm run test:loading-sim
              npm run test:loading-portal
              npm run test:loading-hero
          # Every page at a phone, an iPhone, a tablet, a small laptop and a desktop, light and dark: no large blank
          # band while scrolling, no blank picture box, no text squeezed to a word a line (tools/site/site-empty-space.mjs).
          # Each size still scans every published page in both themes and runs
          # the existing planted controls. The former combined scan exceeded its
          # unchanged 20-minute bound; no measurement limit or case is removed.
          - suite: layout-phone-360
            commands: |
              node --test tests/site/layout/test-empty-space-selection.mjs
              npm run test:empty-space -- --sizes=phone-360
          - suite: layout-iphone-13
            commands: |
              node --test tests/site/layout/test-empty-space-selection.mjs
              npm run test:empty-space -- --sizes=iphone-13
          - suite: layout-tablet-768
            commands: |
              node --test tests/site/layout/test-empty-space-selection.mjs
              npm run test:empty-space -- --sizes=tablet-768
          - suite: layout-laptop-1024
            commands: |
              node --test tests/site/layout/test-empty-space-selection.mjs
              npm run test:empty-space -- --sizes=laptop-1024
          - suite: layout-desktop-1440
            commands: |
              node --test tests/site/layout/test-empty-space-selection.mjs
              npm run test:empty-space -- --sizes=desktop-1440
          - suite: build-workspace-layout-robot-1440
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=1440 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=1440 npm run test:build-workspace
          - suite: build-workspace-layout-robot-1024
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=1024 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=1024 npm run test:build-workspace
          - suite: build-workspace-layout-robot-390
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=390 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=390 npm run test:build-workspace
          - suite: build-workspace-layout-robot-320
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=320 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=robot WORKSPACE_WIDTH=320 npm run test:build-workspace
          - suite: build-workspace-layout-combined-1440
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=1440 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=1440 npm run test:build-workspace
          - suite: build-workspace-layout-combined-1024
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=1024 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=1024 npm run test:build-workspace
          - suite: build-workspace-layout-combined-390
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=390 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=390 npm run test:build-workspace
          - suite: build-workspace-layout-combined-320
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=320 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=combined WORKSPACE_WIDTH=320 npm run test:build-workspace
          - suite: build-workspace-layout-turret-1440
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=1440 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=1440 npm run test:build-workspace
          - suite: build-workspace-layout-turret-1024
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=1024 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=1024 npm run test:build-workspace
          - suite: build-workspace-layout-turret-390
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=390 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=390 npm run test:build-workspace
          - suite: build-workspace-layout-turret-320
            commands: |
              WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=320 npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=layout WORKSPACE_ASSEMBLY=turret WORKSPACE_WIDTH=320 npm run test:build-workspace
          - suite: build-workspace-interactions
            commands: |
              WORKSPACE_CASE=interactions npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=interactions npm run test:build-workspace
              npm run test:build-route
              PLAYWRIGHT_BROWSER=webkit npm run test:build-route
          - suite: build-workspace-playback
            commands: |
              WORKSPACE_CASE=playback npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=playback npm run test:build-workspace
          - suite: build-workspace-print
            commands: |
              WORKSPACE_CASE=print npm run test:build-workspace
              PLAYWRIGHT_BROWSER=webkit WORKSPACE_CASE=print npm run test:build-workspace
          - suite: build-portal
            commands: |
              npm run test:build-guide
              PLAYWRIGHT_BROWSER=webkit npm run test:build-guide
              npm run test:build-portal
              npm run test:carrier-inspection
              npm run test:study-media
              npm run test:highlight-media
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reproduce the pinned legacy mesh coordinate migration.
      # The checkout is mounted into a root-owned test container; trust only this workspace.
      - name: Trust the checked-out workspace in the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Existing evidence/voice/rig checks and the loading suite's media guard use
      # Python's standard library. Declare the interpreter instead of inheriting a runner install.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify the locked browser runtime
        run: |
          node - <<'JS'
          const fs=require('node:fs'),pw=require('@playwright/test');
          if(require('@playwright/test/package.json').version!=='1.56.1')throw Error('Update the pinned browser image with the Playwright lock');
          for(const engine of [pw.chromium,pw.webkit])if(!fs.existsSync(engine.executablePath()))throw Error('Pinned browser executable is missing');
          JS
      - if: matrix.suite == 'build-portal'
        name: Ensure existing media evidence tools are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            apt-get update
            apt-get install --no-install-recommends -y ffmpeg
          fi
      - run: npm run build
      - name: Validate ${{ matrix.suite }}
        env:
          PORT: 8879
          PLAYWRIGHT_CHANNEL: chromium
          SITE_URL: http://127.0.0.1:8879
        run: |
          GYROPUP_PREVIEW_PARENT_PID=$$ node tools/site/serve-site.mjs --ephemeral > /tmp/gyropup-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            /tmp/gyropup-*
            test-results
  # Keep the existing aggregate check name meaningful after splitting layout.
  # A failed, cancelled or skipped browser partition cannot make this gate pass.
  layout:
    name: browser-validation (layout)
    if: always() && github.event_name != 'schedule'
    needs: browser-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all browser partitions to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-validation.result }}
        run: test "$BROWSER_RESULT" = success
  # Preserve main's required presentation context across the two command partitions.
  presentation:
    name: browser-validation (presentation)
    if: always() && github.event_name != 'schedule'
    needs: browser-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all browser partitions to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-validation.result }}
        run: test "$BROWSER_RESULT" = success
  docs-art-freshness:
    # No CAD kernel, native render, browser, credentials or write permissions.
    # Drift requests a documented fleet refresh and reviewed PR; it never reseals
    # an existing scene or silently commits a replacement illustration.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mvalancy/mvalancy
          ref: 70c325d0111427647e2e782d6c04b4123d23cebf
          path: .readme-profile
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/hero/heroes.py
            tools/hero/extract_mesh.py
      - uses: actions/checkout@v4
        with:
          repository: Valpatel/cad-agent
          ref: e662a1ce79b4f63f7352b9d065c5027f77d53a81
          path: .readme-svg
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: software/cadagent/publish/anim/svg.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published inputs and deterministic SVG parity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/site/readme_workshop.py --svg-library .readme-svg/software/cadagent/publish/anim/svg.py --check
          python tools/engineering/robot/readme_design.py check --profile .readme-profile
          python tests/evidence/media/test-readme-design.py
