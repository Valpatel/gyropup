name: Playground and presentation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  browser-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mechanism
            commands: |
              python3 tools/test-print-provenance.py
              python3 research/thread-mating-2026-10-29/test_wrapper.py
              python3 tools/test-base-board-interfaces.py
              python3 tools/test-carrier-connector-inputs.py
              python3 tools/test-carrier-connector-pose.py
              python3 tools/test-carrier-connector-support.py
              python3 research/carrier-insert-fit/verify.py
              python3 research/carrier-insert-fit/test_guards.py
              npm run test:turret
              npm run test:camera
              npm run test:models
              npm run test:legs
          - suite: playground
            commands: |
              npm run test:interactions
              npm run test:robot
              npm run test:sim
              npm run test:demo
          - suite: presentation
            commands: |
              npm run test:notice
              npm run test:hero
              npm run test:viewers
              npm run test:file-viewer-theme
              npm run test:audio
              npm run test:web
              npm run test:progress
              npm run test:highlights
              npm run test:markdown
              npm run test:cache
              npm run test:diagrams
              npm run test:services
          - suite: loading
            commands: |
              npm run test:part-media
              npm run test:portal-data
              npm run test:loading-sim
              npm run test:loading-portal
              npm run test:loading-hero
          - suite: build-portal
            commands: |
              npm run test:build-portal
              npm run test:carrier-inspection
              npm run test:study-media
              npm run test:highlight-media
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reproduce the pinned legacy mesh coordinate migration.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: matrix.suite == 'build-portal'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - name: Validate ${{ matrix.suite }}
        env:
          PORT: 8879
          PLAYWRIGHT_CHANNEL: chromium
          SITE_URL: http://127.0.0.1:8879
        run: |
          node tools/serve-site.mjs > /tmp/gyropup-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            /tmp/gyropup-*
            test-results
