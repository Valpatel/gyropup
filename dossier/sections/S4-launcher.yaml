  - I-feed
  - I-wheel-l
  - I-wheel-r
  - I-flap
  - I-ct
  - I-hopper-inserts
  - I-barrel
  - I-laser-inserts
  - I-feed-servo
  - I-motor-l
  - I-motor-r
  - I-esc-l
  - I-esc-r
  - I-cart-board
  - I-hopper-seat
  - I-laser-pad
