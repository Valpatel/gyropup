  - gate:assembly
  - gate:motion
  - turret-launch
- id: flywheel_tyre
  function: 'The left Ø38 tyre: squeezes the ball 40 % at the nip'
  interfaces:
  - I-tyre-l
  material: &id002
    name: TPU 95A
    process: FDM
    wall_mm: 0.8
  checks:
  - gate:connectivity
  - gate:assembly
  - gate:motion
  - gate:turret-path
  - gate:turret-ammo
  - turret-launch
- id: flywheel_tyre_m
