  - gate:assembly
  - gate:motion
  - turret-launch
- id: flywheel_motor_r
  function: 'SunnySky X2216 1400KV V3: spins the right wheel'
  interfaces:
  - I-motor-r
  - I-hub-r
  material:
    name: SunnySky X2216 1400KV V3
    process: bought
  checks:
  - gate:connectivity
  - gate:assembly
  - gate:motion
