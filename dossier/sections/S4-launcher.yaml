# The turret's dossier (cad-agent: docs/dossier.md in the toolkit). Hand-edited YAML; joined by id to the geometry
# cad/turret_dossier.py registers (exports/dossier-geometry.json). The design story is docs/turret-sections.md.
id: S4-launcher
title: 'Launcher: flywheel cage, motors, nip'
purpose: Throw a Rival round at about 95-100 fps from two counter-rotating wheels that squeeze it 40 %, and never let any
  accepted round leave above 105 fps
requirements:
- R6
- R7
- R8
- R9
- R10
- R12
- R13
- R14
- R18
author: turret-dossier agent
interfaces:
- id: I-wheel-l
  between:
  - flywheel
  - cartridge_body
  kind: revolute
  datum: the left motor axis, C (wheel_x, +wheel_y, z)
  description: 'The left hub on its X2216''s prop adapter (intended contact with flywheel_motor_l). The chain rule measures
    it from the hub to the cartridge (3.5 mm): clearance 4 mm.'
  clearance: 4.0
  owner: S4-launcher
- id: I-wheel-r
  between:
  - flywheel_m
  - cartridge_body
  kind: revolute
  datum: the right motor axis, C (wheel_x, -wheel_y, z)
  description: 'The right hub on its X2216''s prop adapter (intended contact with flywheel_motor_r). Measured from the hub
    to the cartridge (1.1 mm): clearance 1.5 mm.'
  clearance: 1.5
  owner: S4-launcher
- id: I-motor-l
  between:
  - flywheel_motor_l
  - cartridge_body
  kind: fastened
  datum: under the cage's top plate
  description: Hangs bell-down on 4 x M3 x 6.
  owner: S4-launcher
- id: I-motor-r
  between:
  - flywheel_motor_r
  - cartridge_body
  kind: fastened
  datum: under the cage's top plate
  description: Hangs bell-down on 4 x M3 x 6.
  owner: S4-launcher
- id: I-esc-l
  between:
  - esc_l
  - cartridge_body
  kind: contact
  datum: the cage plate's top
  description: 'On the cage plate under the cartridge board (drawn 0.01 mm into the plate: 3.4 mm^3, an intended overlap).'
  owner: S4-launcher
- id: I-esc-r
  between:
  - esc_r
  - cartridge_body
  kind: contact
  datum: the cage plate's top
  description: 'On the cage plate under the cartridge board (drawn 0.01 mm into the plate: 3.4 mm^3, an intended overlap).'
  owner: S4-launcher
- id: I-cart-board
  between:
  - cartridge_board
  - cartridge_body
  kind: fastened
  datum: four printed posts on the cage plate
  description: The cartridge board on its posts over the ESCs.
  owner: S4-launcher
- id: I-tyre-l
  between:
  - flywheel_tyre
  - flywheel
  kind: bonded
  datum: the hub's Ø30 rim
  description: 'The TPU tyre bonded over the rim (D68: a free tyre would grow at speed).'
  owner: S4-launcher
- id: I-tyre-r
  between:
  - flywheel_tyre_m
  - flywheel_m
  kind: bonded
  datum: the hub's Ø30 rim
  description: The TPU tyre bonded over the rim.
  owner: S4-launcher
- id: I-hub-l
  between:
  - flywheel
  - flywheel_motor_l
  kind: other
  datum: the prop adapter's Ø5 pilot
  description: The hub on the motor's prop adapter, washer and M5 nylon-insert nut (the torque path of I-wheel-l).
  owner: S4-launcher
- id: I-hub-r
  between:
  - flywheel_m
  - flywheel_motor_r
  kind: other
  datum: the prop adapter's Ø5 pilot
  description: The hub on the motor's prop adapter (the torque path of I-wheel-r).
  owner: S4-launcher
