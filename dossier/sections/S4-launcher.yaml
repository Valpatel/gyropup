decisions:
- id: T4.1
  decision: Horizontal wheels either side of the path, the motors above
  why: The ball's spin axis is vertical (no lift), and the motors sit over the cartridge
  alternatives:
  - option: Wheels above and below the path
    rejected: 'the ball''s spin axis horizontal: lift or dip, and a motor under the barrel'
- id: T4.2
  decision: One printed cartridge body for the housing, chute, cage and socket
  why: The ball's path is in one part, so nothing can step at a joint
  alternatives:
  - option: A separate cage and housing
    rejected: a seam across the chute
- id: T4.3
  decision: 40 % crush on Ø38 tyres (sim/turret_launch.py crush_choice)
  why: With enough crush the ball catches the tyre and leaves at about 0.95 of the surface speed, the regime D68 needs (the
    ceiling is the surface speed)
  alternatives:
  - option: Ø36 at 31 % on the old cage
    rejected: the Hasbro ball 82 fps
  - option: Ø40 at 49 %
    rejected: the worst corner 108.5 fps on the same rail, and more squeeze on the bearings
- id: T4.4
  decision: The X2216 1400 KV on an ~11.3 V rail
  why: Inside the motor's 2-4S rating, and a plain buck holds it from both supplies
  alternatives:
  - option: The 880 KV on ~18 V
    rejected: 5S, over the X2216's rating, and a buck-boost from a pack that sags to 15 V
  - option: The 1100 or 1250 KV
    rejected: 13.7-15.1 V and 12.1-13.3 V sit too close to 15 V for a buck
- id: T4.5
  decision: The flywheel rail trimmed per turret by one fixed resistor on the TDK i6A4W's TRIM pin
  why: Untrimmed, the KV spread and the converter's +-4 % cannot meet both D68 numbers at once
  alternatives:
  - option: A Pololu D42V110F12
    rejected: 'fixed 12 V +-4 %: no trim'
  - option: A pot
    rejected: it can be turned
  - option: KV-binned motors
    rejected: SunnySky publishes no KV tolerance to bin on
- id: T4.6
  decision: The tyres bonded to the hubs
  why: 'At ~16,000 rpm a free TPU ring grows 8 % in its bore: it would float, crush the ball 61 % and throw 113 fps'
  alternatives:
  - option: A stretched, unbonded tyre
    rejected: grows off the hub at speed
- id: T4.7
  status: open
  decision: 'The cartridge body''s recoil case: layer-aware SF 1.38 against 2.0 at the 105 fps ceiling (1.53 at the 95 fps
    set speed), its peak at the CT''s rear dowel in the 3 mm base plate. Options: Ø4 x 12 dowels in holes 6 mm into the new
    bosses, or a second latch'
  why: The FEA (a CAD host, 2026-10-28) found it after the cage's spine, webs and latch boss raised the fall case to 2.21
